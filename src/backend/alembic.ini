# Alembic configuración para ROCCA
# Ejecutar desde src/backend:
#   alembic upgrade head
#   alembic revision --autogenerate -m "descripcion"

[alembic]
# Ruta al script de migraciones
script_location = ./migrations

# Plantilla para generar nuevas migraciones
file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s

# Formato de log de migraciones
prepend_sys_path = .

# URL de la base de datos (se sobreescribe en env.py con ROCCA_DATABASE_URL)
sqlalchemy.url = sqlite:///./rocca.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
